<!doctype html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1322" />
  <meta name="description" content="ჰისნი — ბიოგრაფი ლივინგის მულტიფუნქციური საცხოვრებელი კომპლექსი ისანში, ისნის მეტროს მოპირდაპირედ. ოთხი 36-სართულიანი თაუერი." />
  <meta property="og:title" content="ჰისნი · Hisni by Biograpi" />
  <meta property="og:description" content="ჰისნი — ბიოგრაფი ლივინგის მულტიფუნქციური საცხოვრებელი კომპლექსი ისანში, ისნის მეტროს მოპირდაპირედ. ოთხი 36-სართულიანი თაუერი." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ka_GE" />
  <meta property="og:url" content="https://gdvali777-jpg.github.io/HISNI-3D-Landscape/" />
  <meta property="og:image" content="https://gdvali777-jpg.github.io/HISNI-3D-Landscape/renders/aerial-day.jpg" />
  <meta property="og:image:width" content="1600" />
  <meta property="og:image:height" content="900" />
  <meta property="og:image:alt" content="ჰისნი — საჰაერო ხედი დღისით" />
  <meta property="og:image" content="https://gdvali777-jpg.github.io/HISNI-3D-Landscape/renders/aerial-day.webp" />
  <meta property="og:image:width" content="1600" />
  <meta property="og:image:height" content="900" />
  <meta property="og:image:alt" content="ჰისნი — საჰაერო ხედი დღისით" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>ჰისნი · Hisni by Biograpi — 3D</title>
  <link rel="icon" href="./brand/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="./fonts/pingl-400.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    (function () {
      var q = location.search;
      var en = /(?:^|[?&])lang=en(?:&|$)/.test(q);
      if (!en && !/(?:^|[?&])lang=ka(?:&|$)/.test(q)) {
        try { en = localStorage.getItem('hisni-lang') === 'en'; } catch (e) { en = false; }
      }
      if (en) document.documentElement.lang = 'en';
      if (!/(?:^|[?&])(?:view=render|mode=render)(?:&|$)/.test(q)) return;
      document.documentElement.classList.add('boot-render');
      var narrow = matchMedia('(max-width: 819px)').matches;
      var l = document.createElement('link');
      l.rel = 'preload'; l.as = 'image'; l.fetchPriority = 'high';
      l.href = narrow ? './renders/view-07-720.webp' : './renders/view-07.webp';
      document.head.appendChild(l);
    })();
  </script>
</head>
<body>
<main id="app">
  <div id="viewport" role="region" tabindex="0" aria-label="3D ხედი. გადაათრიე დასატრიალებლად, ორი თითით ან სქროლით — მასშტაბი."></div>
  <div id="render-view" hidden>
    <img id="render-blur" class="render-blur" alt="" aria-hidden="true" width="1243" height="1600" />
    <div id="render-stage">
      <img id="render-img" alt="" width="1243" height="1600" fetchpriority="high" />
      <img id="render-fade" alt="" aria-hidden="true" width="1243" height="1600" />
      <svg id="render-svg" aria-hidden="false"></svg>
    </div>
    <div class="render-vignette" aria-hidden="true"></div>
    <p id="render-ph" class="render-ph" hidden>Placeholder</p>
    <div id="render-tip" class="render-tip" hidden></div>
    <div class="render-panel">
      <form id="render-filters" class="render-filters"></form>
    </div>
    <div class="day-night" role="group" id="day-night">
      <button type="button" id="day-mode" aria-pressed="true">დღე</button>
      <button type="button" id="night-mode" aria-pressed="false">ღამე</button>
    </div>
    <div class="render-spin">
      <button type="button" data-spin="-1" data-i18n-aria="spinPrev">‹</button>
      <div id="render-dots" class="render-dots"></div>
      <button type="button" data-spin="1" data-i18n-aria="spinNext">›</button>
      <span id="render-frame-label" class="render-frame-label"></span>
    </div>
  </div>
  <script>
    if (document.documentElement.classList.contains('boot-render')) {
      var view = document.getElementById('render-view');
      var img = document.getElementById('render-img');
      view.hidden = false;
      var narrow = matchMedia('(max-width: 819px)').matches;
      img.src = narrow ? './renders/view-07-720.webp' : './renders/view-07.webp';
      img.alt = 'Hisni';
      var blur = document.getElementById('render-blur');
      if (blur) blur.src = img.src;
    }
  </script>
  <div id="labels"></div>

  <div id="block-picker" class="block-picker">
    <div id="block-menu-root" class="render-blocks">
      <button type="button" id="block-btn" class="render-block-btn" aria-haspopup="true" aria-expanded="false" aria-controls="block-menu">ბლოკი ▾</button>
      <div id="block-menu" class="render-block-menu" role="radiogroup" hidden></div>
    </div>
    <div class="places-wrap">
      <button type="button" id="places-btn" class="places-btn" aria-expanded="false" aria-controls="places-panel">ადგილები</button>
      <div id="places-panel" class="places-panel" hidden>
        <div id="places-cats" class="places-cats" role="group"></div>
        <button type="button" id="places-list-toggle" class="places-list-toggle" aria-expanded="false"></button>
        <ul id="places-list" class="places-list" hidden></ul>
      </div>
    </div>
  </div>

  <header class="header">
    <a class="brand" href="https://biograpi.ge/" target="_blank" rel="noopener"><img src="./brand/hisni-dark.webp" alt="Hisni by Biograpi" width="150" height="43" /></a>
    <div class="header-right">
      <button id="view-toggle" class="chip" type="button" hidden></button>
      <button id="filter-open" class="chip" data-i18n="filters"></button>
      <button id="about-open" class="chip icon-i" type="button" aria-label="პროექტის შესახებ">i</button>
      <button id="lang" class="chip lang" aria-label="EN, ინგლისურზე გადართვა"></button>
    </div>
  </header>

  <div id="bg-switch" class="bg-switch" hidden role="group">
    <button type="button" data-pano="1" aria-pressed="false">1</button>
    <button type="button" data-pano="2" aria-pressed="false">2</button>
    <button type="button" data-pano="3" aria-pressed="false">3</button>
    <button type="button" data-pano="standard" data-i18n="bgStandard" aria-pressed="false"></button>
  </div>

  <section id="intro" class="intro panel">
    <button type="button" id="intro-toggle" class="intro-toggle" aria-expanded="true"><span class="intro-chev" aria-hidden="true"></span></button>
    <div class="intro-keep">
      <h1><span data-i18n="title">ჰისნი</span> <em data-i18n="titleSub">15-წუთიანი ქალაქი</em></h1>
      <div class="intro-actions">
        <button id="start" class="primary" data-i18n="explore">აირჩიე ბინა</button>
        <a id="intro-call" class="call-btn" href="tel:+995322500505" data-call="intro">დარეკვა</a>
      </div>
    </div>
    <div class="intro-more">
    <p class="eyebrow" data-i18n="address">ქეთევან დედოფლის გამზ. 69, ისანი, თბილისი</p>
    <p id="intro-avail" class="intro-avail"></p>
    <p class="intro-copy" data-i18n="introCopy">მულტიფუნქციური საცხოვრებელი კომპლექსი ისნის მეტროს მოპირდაპირე მხარეს.</p>
    <div class="stats">
      <div><strong>4</strong><small data-i18n="statTowers"></small></div>
      <div><strong>36</strong><small data-i18n="statFloors"></small></div>
      <div><strong>40,000<sup>*</sup></strong><small data-i18n="statMall"></small></div>
      <div><strong>8,000<sup>*</sup></strong><small data-i18n="statGreen"></small></div>
    </div>
    <p class="stat-src"><a id="stat-src" href="https://biograpi.ge/ka/news/hisni-presale-start" target="_blank" rel="noopener">* <span data-i18n="statSrc"></span></a></p>
    <button type="button" id="intro-about" class="text-link" data-i18n="aboutRenders"></button>
    </div>
  </section>
  <script>
    if (document.documentElement.lang === 'en') {
      var enText = {
        title: 'Hisni',
        titleSub: 'A 15-minute city',
        explore: 'Find an apartment',
        address: '69 Ketevan Dedofali Ave, Isani, Tbilisi',
        introCopy: 'A multifunctional residential complex directly opposite the Isani metro station.',
        statTowers: 'Towers',
        statFloors: 'Floors',
        statMall: 'sq.m shopping center',
        statGreen: 'sq.m recreational space',
        aboutRenders: 'About the project and renders',
        statSrc: 'Source: biograpi.ge, 3 Nov 2026'
      };
      Object.keys(enText).forEach(function (key) {
        var el = document.querySelector('[data-i18n="' + key + '"]');
        if (el) el.textContent = enText[key];
      });
      var call = document.querySelector('#intro-call');
      if (call) call.textContent = 'Call';
    }
  </script>

  <nav id="crumbs" class="crumbs" hidden aria-label="Explorer"></nav>
  <aside id="explorer" class="explorer panel" hidden>
    <div class="explorer-bar">
      <button type="button" id="explorer-handle" class="drag-handle" aria-expanded="true"></button>
      <button type="button" id="explorer-close" class="x">×</button>
    </div>
    <div id="explorer-body" class="explorer-body"></div>
  </aside>
  <aside id="apt-card" class="apt-card panel sheet" hidden></aside>
  <aside id="filters" class="filters panel sheet" hidden aria-label="Filters"></aside>
  <aside id="place-card" class="place-card panel" hidden></aside>

  <aside class="layers panel" id="layers">
    <button id="layers-toggle" class="panel-heading" aria-expanded="false" aria-controls="layer-options" aria-label="რუკის ფენები"><span class="layers-ico" aria-hidden="true"></span><span data-i18n="layers"></span></button>
    <div id="layer-options" hidden>
      <label><input type="checkbox" data-layer="buildings" checked /> <span data-i18n="lBuildings"></span></label>
      <label><input type="checkbox" data-layer="vegetation" checked /> <span data-i18n="lTrees"></span></label>
      <label><input type="checkbox" data-layer="labels" checked /> <span data-i18n="lLabels"></span></label>
    </div>
    <div class="light" role="group" aria-label="Light">
      <button data-light="day" class="active" aria-pressed="true" data-i18n="day"></button>
      <button data-light="golden" aria-pressed="false" data-i18n="golden"></button>
      <button data-light="night" aria-pressed="false" data-i18n="night"></button>
    </div>
  </aside>

  <nav class="tools panel" aria-label="Camera">
    <button id="zoom-in" data-i18n-aria="zoomIn">+</button>
    <button id="zoom-out" data-i18n-aria="zoomOut">−</button>
    <button id="rotate" data-i18n-aria="rotate" aria-pressed="false">⟳</button>
    <button id="reset" data-i18n-aria="resetView">⌂</button>
  </nav>

  <div class="map-meta"><div class="north" aria-hidden="true"><span>N</span><svg id="needle" viewBox="0 0 40 40"><path d="m20 4 8 27-8-6-8 6Z" fill="currentColor"/></svg></div></div>

  <footer><span data-i18n="attribution"></span> · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© OpenStreetMap</a></footer>

  <div id="hint" class="hint" hidden><p></p><button id="hint-ok" class="hint-x" type="button" aria-label="დახურვა">×</button></div>
  <div id="loading" class="mini" role="status"><img src="./brand/hisni-dark.webp" alt="" width="180" height="51" /><p data-i18n="loading"></p><div class="bar"><i></i></div></div>
  <div id="announce" class="sr-only" aria-live="polite"></div>

  <dialog id="about"></dialog>
  <dialog id="lead"></dialog>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
