name: Refresh inventory from Bitrix

# Reads apartment status and price from the Bitrix24 catalog (HISNI section) and, only when
# something changed, commits public/data/apartments.json and redeploys the site.
# Needs the repository secret BITRIX_WEBHOOK_URL (an inbound webhook on crm.biograpi.ge).
# Without the secret the job does nothing. The script only calls Bitrix list/get methods.

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17 (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show the changes, do not commit'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-inventory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check data tests
        run: node --test tests/data/*.test.mjs

      - name: Read Bitrix and update the data file
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/refresh-inventory.mjs --from-bitrix --dry-run
          else
            node scripts/refresh-inventory.mjs --from-bitrix
          fi

      - name: Commit and redeploy when the data changed
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/apartments.json; then
            echo "No changes in Bitrix."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/apartments.json
          git commit -m "Refresh Hisni inventory from Bitrix ($(TZ=Asia/Tbilisi date +%Y-%m-%d))"
          git push
          # Pushes made with the workflow token do not start other workflows, so start the deploy here.
          gh workflow run pages.yml --ref main
